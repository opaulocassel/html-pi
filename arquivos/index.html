<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Site com Mapa</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <header>
      <div id="login">
        <button onclick="openDialog()">Iniciar Sessão</button>
      </div>

      <section id="customDialog" class="dialog">
        <div class="titulo">
          <h1><span>Iniciar Sess</span>ão</h1>
        </div>

        <div class="icone">
          <img src="/IMG/left-arrow.png" alt="Back" />
        </div>

        <div class="email">
          <p>E-mail</p>
          <input type="email" />
        </div>

        <div class="senha">
          <p>Senha</p>
          <input type="password" />
        </div>

        <div class="lembrar">
          <input type="checkbox" class="lembrarSenha" />
          <label for="lembrarSenha">Lembrar senha</label>
        </div>

        <div class="botoes">
          <button onclick="cadastrar()">Cadastrar</button>
          <button onclick="entrar()">Entrar</button>
        </div>
      </section>
    </header>

    <main>


        
    </main>

    <footer>



    </footer>

    <script src="index.js"></script>
  </body>
</html>
