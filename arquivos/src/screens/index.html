  <main>
    <section class="paginaLogin">
      <div class="form" id="form">
        <form class="loginForm" id="loginForm">
          <div class="icone">
            <i class="bi bi-x-square-fill" onclick="closeDialog()" alt="Back"></i>
          </div>
          <h2>Entrar</h2>
          <div class="login_interface">
            <div class="requerimento_interface">
              <div class="input_username">
                <input onclick="adicionarPlaceholder('loginNome', 'Informe seu nome')" type="text" id="loginNome"
                  maxlength="30" name="login-username" placeholder="Informe seu nome" required />
              </div>
              <div class="input_password">
                <input onclick="adicionarPlaceholder('loginSenha', 'Digite sua senha')" type="password" id="loginSenha"
                  maxlength="15" name="login-password" placeholder="Digite sua senha" required />
              </div>
            </div>

            <div class="login_button">
              <button type="submit" class="botao">Login</button>
            </div>

            <div class="login_fotter">
              <p class="message">
                Não é registrado?
                <a id="linkLogin" onclick="cadastrar()" href="#">Crie uma conta</a>
              </p>
            </div>
          </div>
        </form>

        <form class="registerForm" id="registerForm">
          <div class="icone">
            <i class="bi bi-x-square-fill" onclick="closeDialog()" alt="Back"></i>
          </div>
          <h2>Registrar</h2>

          <input onclick="adicionarPlaceholder('nomeUsuario', 'Insira seu nome')" type="text" id="nomeUsuario"
            maxlength="30" name="nomeUsuario" placeholder="Insira seu nome" required />
          <input onclick="adicionarPlaceholder('telefone', 'Telefone')" type="text" id="telefone" maxlength="11"
            name="telefone" placeholder="Telefone" required />
          <input onclick="adicionarPlaceholder('email', 'Insira seu email')" type="email" id="email" maxlength="50"
            name="email" placeholder="Insira seu email" required />
          <input onclick="adicionarPlaceholder('senha', 'Escolha uma senha')" type="password" id="senha" maxlength="15"
            name="senha" placeholder="Escolha uma senha" required />

          <input onclick="adicionarPlaceholder('confirmarSenha', 'Confirme a senha')" type="password"
            id="confirmarSenha" maxlength="15" name="confirmarSenha" placeholder="Confirme a senha" required />

          <button type="button" class="botao" onclick="adicionarUsuario()">
            Criar Usuário
          </button>

          <p class="message">
            Já é registrado?
            <a class="linkRegistrar" onclick="openDialog()" href="#">
              Entrar</a>
          </p>
        </form>
      </div>
    </section>

    <section class="formPerfil" id="formPerfil">
      <div class="icone">
        <i class="bi bi-arrow-left-square-fill" onclick="closePerfilDialog()" alt="Back"></i>
    </section>
