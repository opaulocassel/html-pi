<!DOCTYPE html>
<!-- Coding By CodingNepal - codingnepalweb.com -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar Menu | Side Navigation Bar</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Lato:300,400|Poppins:300,400,800&display=swap');

        .containerCard {
            width: 100%;
            height: 100vh;
            background-color: #232323;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .postCard {
            width: 350px;
            height: 500px;
            display: flex;
            overflow: hidden;
            flex-direction: column;
            position: relative;
        }

        .header_postCard {
            width: 100%;
            height: 40%;
            background: #ddd;
            position: absolute;
            top: 0;
        }

        .header_postCard img {
            max-width: 100%;
            height: auto;
            transition: ease-in-out 600ms;
        }


        .body_postCard {
            width: 100%;
            height: 60%;
            background: #fff;
            position: absolute;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }


        .postCard_content {
            width: 80%;
            height: 80%;
            background: #fff;
            position: relative;
        }

        .postCard_content h1 {
            font-size: 20px;
            font-weight: bold;
        }

        .postCard_content p {
            font-size: 14px;
            font-weight: normal;
        }

        .containerCard_infos {
            width: 100%;
            display: flex;
            justify-content: space-between;
            position: absolute;
            bottom: 0;
            border-top: 1px solid rgba(0, 0, 0, .2);
            padding-top: 25px;
        }

        .postCardedBy {
            display: flex;
            flex-direction: column;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        span {
            font-size: 12px;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 1px;
            font-weight: bold;
        }


        .containerCard_tags {
            display: flex;
            flex-direction: column;
        }
    </style>
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet" />
</head>

<body class="antialiased bg-gray-200 font-sans">
    <div class="containerCard">
        <div class="postCard">
            <div class="header_postCard">
                <img src="https://lh3.googleusercontent.com/p/AF1QipPDFKOVHu7EAl20edZ_mhsrGPBKdLnJt6PAn938=s680-w680-h510"
                    alt="">
            </div>

            <div class="body_postCard">
                <div class="postCard_content">

                    <h1>Lorem Ipsum</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Adipisci animi assumenda cumque
                        deserunt
                        dolorum ex exercitationem.</p>

                    <div class="containerCard_infos">
                        <div class="flex items-center pt-2">
                            <div class="bg-cover bg-center w-10 h-10 rounded-full mr-3"
                                style="background-image: url(https://seeklogo.com/images/P/Petrobras-logo-03DABEE0AC-seeklogo.com.png)">
                            </div>
                            <div>
                                <p class="font-bold text-gray-900">${posto.enderecoPosto}</p>
                                <p class="text-sm text-gray-700">${posto.ruaPosto}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
